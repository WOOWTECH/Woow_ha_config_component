# 早晨例行腳本 - Morning Routine Script

morning_wakeup:
  alias: "早晨起床程序"
  description: "漸進式喚醒：燈光從暗到亮，播放輕音樂"
  sequence:
    - service: light.turn_on
      target:
        entity_id: light.bedroom
      data:
        brightness: 30
        color_temp: 500
        transition: 10

    - delay: "00:02:00"

    - service: light.turn_on
      target:
        entity_id: light.bedroom
      data:
        brightness: 100
        color_temp: 370
        transition: 10

    - service: media_player.volume_set
      target:
        entity_id: media_player.bedroom_speaker
      data:
        volume_level: 0.1

    - service: media_player.play_media
      target:
        entity_id: media_player.bedroom_speaker
      data:
        media_content_id: "https://example.com/gentle-alarm"
        media_content_type: "music"

    - delay: "00:05:00"

    - service: light.turn_on
      target:
        entity_id:
          - light.bedroom
          - light.kitchen
      data:
        brightness: 200
        color_temp: 250
        transition: 5

    - service: climate.set_temperature
      target:
        entity_id: climate.living_room_ac
      data:
        temperature: 24
